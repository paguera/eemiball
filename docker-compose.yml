# Mise en ligne d'EEMI Ball avec HTTPS automatique (Caddy + Let's Encrypt)
# 1. copier .env.example en .env et y mettre le domaine
# 2. faire pointer le domaine (enregistrement DNS A) vers l'IP du serveur
# 3. docker compose up -d
services:
  web:
    image: docker.io/library/caddy:2.8
    container_name: eemiball
    restart: unless-stopped
    environment:
      DOMAIN: http://${DOMAIN:?Mets ton domaine dans le fichier .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - ./public:/srv:ro,Z
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - nas-net

volumes:
  caddy_data:
  caddy_config:

networks:
  nas-net:
    external: true
